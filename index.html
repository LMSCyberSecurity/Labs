<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERSECURITY FOUNDATIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1a212c;
    --surface: #232c39;
    --card: #2a3441;
    --border: rgba(255,255,255,0.07);
    --text: #eceff3;
    --text-muted: #8fa0b3;
    --text-faint: #64748a;
    --accent: #e3a25a;
    --accent-dim: rgba(227,162,90,0.16);
    --accent-line: rgba(227,162,90,0.35);
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.display{ font-family: 'Fraunces', serif; }
  ::selection{ background: var(--accent-dim); color: var(--accent); }

  /* ---------- ORG CODE MODAL ---------- */
  .modal-overlay{
    position: fixed; inset: 0;
    background: transparent;
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .modal-overlay.open{ opacity: 1; pointer-events: auto; }

  .modal-box{
    position: relative;
    width: min(360px, 88vw);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 30px 26px 26px;
    transform: translateY(10px) scale(.98);
    transition: transform .2s ease;
    background: transparent;

  }
  .modal-overlay.open .modal-box{ transform: translateY(0) scale(1); }

  /* Background image that fully fills the modal overlay (backdrop) */
  .modal-bg-image{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Modal box sits above the background image */
  .modal-box{
    position: relative;
    z-index: 1;
    top:5%;
    background: transparent;

  }

  /* FlipBook id tag kept in DOM but hidden from view */
  .modal-kicker{
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--accent); font-weight: 600; margin-bottom: 8px;
    display: none;
  }
  .modal-title{
    margin: 0 0 4px; font-size: 19px; font-weight: 600; color: black;text-align:center;color:#B8DFF5;
  }
  .modal-sub{
    margin: 0 0 18px; font-size: 12.5px; color: var(--text-muted);
  }

  .modal-input{
    width: 100%;
    background: white;
    border: 1px solid var(--border);
    border-radius: 30px;
    color:black;
    font-size: 20px;
    letter-spacing: 8px;
    text-align: center;
    padding: 12px 10px;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .modal-input::placeholder{ color: var(--text-faint); letter-spacing: 8px; }
  .modal-input:focus{
    border-color: var(--accent);
  }

  .modal-msg{
    min-height: 18px;
    margin-top: 10px;
    font-size: 12px;
    text-align: center;
    color:black;
  }
  .modal-msg.error{ color: #e57373; }
  .modal-msg.success{ color: #7fd99a; }
  .modal-msg.loading{ color: var(--text-muted); }

  .modal-submit{
    all: unset;
    display:flex; align-items:center; justify-content:center;
    width: 100%; margin-top: 14px;
    background: var(--accent);
    color: #1a1208;
    font-size: 13px; font-weight: 600; letter-spacing: .3px;
    padding: 11px 0; border-radius: 999px; cursor:pointer;
    transition: filter .15s ease, transform .15s ease, opacity .15s ease;
    margin-top:0px;
  }
  .modal-submit:hover{ filter: brightness(1.08); transform: translateY(-1px); }
  .modal-submit:disabled{ opacity: .6; cursor: default; transform:none; }

  /* ---------- FLIPBOOK VIEWER ---------- */
  .book-view{
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: none;
  }
  .book-view.open{ display: block; }
  .book-iframe{
    width: 100%; height: 100%;
    border: 0; display: block;
  }
/* From Uiverse.io by ferlagher */ 
button {
  position: relative;
  font-size: 1.0em;
  padding: 0.7em 1.0em;
  background-color: #BF0426;
  text-decoration: none;
  border: none;
  border-radius: 0.5em;
  color: #DEDEDE;
  cursor:pointer;
  width:100%;
  background: #021d6e;
}

button::before {
  position: absolute;
  content: '';
  height: 0;
  width: 0;
  top: 0;
  left: 0;
  background: linear-gradient(135deg, rgba(33,33,33,1) 0%, rgba(33,33,33,1) 50%, rgba(150,4,31,1) 50%, rgba(191,4,38,1) 60%);
  border-radius: 0 0 0.5em 0;
  transition: 0.3s;
}

button:hover::before {
  width: 1.6em;
  height: 1.6em;
}

button:active {
  box-shadow: 0.2em 0.2em 0.3em rgba(0, 0, 0, 0.3);
  transform: translate(0.1em, 0.1em);
}
</style>
</head>
<body>

  <!-- ---------- FLIPBOOK VIEWER (loads inside this page, address bar never changes) ---------- -->
  <div class="book-view" id="bookView">
    <iframe
      class="book-iframe"
      id="bookFrame"
      src="about:blank"
      title="FlipBook"
      allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media; picture-in-picture; downloads"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>

  <!-- ---------- ORG CODE MODAL ---------- -->
  <div class="modal-overlay open" id="codeModalOverlay">
    <img class="modal-bg-image" src="Landingbg.svg" alt="" />
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-kicker" id="modalBookTag">CYBERSECURITY FOUNDATIONS</div>
      <h3 class="modal-title" id="modalTitle">ENTER ACCESS CODE</h3>

      <input
        type="text"
        id="codeInput"
        class="modal-input"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
        placeholder="• • • •"
      />

      <div class="modal-msg" id="modalMsg"></div>

      <button class="button" id="modalSubmit">
        <span id="modalSubmitLabel">VERIFY &amp; CONTINUE</span>
      </button>
    </div>
  </div>

<script>
  /* ============================================================
     ORGANIZATION CODE VERIFICATION
     Same Google Apps Script Web App logic as before.
     FLIP_ID identifies which book this page grants access to —
     change it per deployment, or wire it to a URL query param
     (e.g. ?id=FlipBook-01) if you need one page to serve several books.
  ============================================================ */
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyl2wbgTIYyfbkr55PFNAy9J8Jb8pQN1A2UtiNeDYHYqB-WRpjadEHDI7m1Dzwvxz6ETA/exec";

  // Pull the book id from ?id=... if present, otherwise fall back to this default.
  const urlParams = new URLSearchParams(window.location.search);
  const FLIP_ID = urlParams.get('id') || "FlipBook-01";

  const overlay        = document.getElementById('codeModalOverlay');
  const modalBookTag    = document.getElementById('modalBookTag');
  const modalBookName   = document.getElementById('modalBookName');
  const codeInput        = document.getElementById('codeInput');
  const modalMsg         = document.getElementById('modalMsg');
  const modalSubmit      = document.getElementById('modalSubmit');
  const modalSubmitLabel = document.getElementById('modalSubmitLabel');

  modalBookTag.textContent = FLIP_ID;

  function setMsg(text, type) {
    modalMsg.textContent = text;
    modalMsg.className = 'modal-msg' + (type ? ' ' + type : '');
  }

  function setLoading(isLoading) {
    modalSubmit.disabled = isLoading;
    modalSubmitLabel.textContent = isLoading ? 'Checking…' : 'Verify & Continue';
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && overlay.classList.contains('open')) verifyCode();
  });

  modalSubmit.addEventListener('click', verifyCode);

  function verifyCode() {
    const code = codeInput.value.trim();
    if (!code) {
      setMsg('Please enter your organization code.', 'error');
      return;
    }

    setLoading(true);
    setMsg('Checking code…', 'loading');

    const url = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(FLIP_ID)}&code=${encodeURIComponent(code)}`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (data.status === 'ok' && data.redirect) {
          setMsg('Code verified — loading FlipBook…', 'success');
          setTimeout(() => {
            overlay.classList.remove('open');
            showBook(data.redirect);
          }, 400);
        } else {
          setLoading(false);
          setMsg('Code Not Registered', 'error');
        }
      })
      .catch(() => {
        setLoading(false);
        setMsg('Could not verify right now. Please try again.', 'error');
      });
  }

  /* ---------- FLIPBOOK VIEWER (in-page iframe, address bar never changes) ---------- */
  const bookView  = document.getElementById('bookView');
  const bookFrame = document.getElementById('bookFrame');

  function showBook(url) {
    bookFrame.src = url;
    bookView.classList.add('open');
  }

  // focus the input on load since the modal is shown immediately
  window.addEventListener('load', () => codeInput.focus());
</script>
</body>
</html>
